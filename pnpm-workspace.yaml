packages:
  - 'platforms/*'
  - 'packages/*'
  - 'examples/*'

# pnpm settings live in this file, not in package.json's "pnpm" field: pnpm 11
# reads only this file (it ignores the field and warns about it). Both keys are
# kept: pnpm 10 reads `onlyBuiltDependencies`, pnpm 11 `allowBuilds`, and a
# build not allowed is an install error on pnpm 11.
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
  '@parcel/watcher': false
  sharp: false
# pnpm 11 refuses a release younger than its minimum age; delegated-identity 0.1.0
# and 0.2.0 were each published the day this depended on them. Drop an entry once it is older.
minimumReleaseAgeExclude:
  - delegated-identity@0.1.0
  - delegated-identity@0.2.0
